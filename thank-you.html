<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you! | Kaia's Slime Magic</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@400;800&display=swap">
<style>
:root{--ground:#F8F3FC;--ink:#26143A;--muted:#6B5A7E;--pink:#D6309C;--pink-ink:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--ground:#170C24;--ink:#F4ECFB;--muted:#BBA8CF;--pink:#F05BB8;--pink-ink:#1B0B24;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:400 17px/1.6 Nunito,system-ui,sans-serif;text-align:center;padding:24px 20px}
img{width:220px;max-width:100%;height:auto}
h1{font:700 clamp(2rem,6vw,3rem)/1.1 Fredoka,system-ui,sans-serif;margin:12px 0}
p{color:var(--muted);max-width:40ch;margin:0 auto 20px}
a{display:inline-block;background:var(--pink);color:var(--pink-ink);font-weight:800;text-decoration:none;padding:14px 22px;border-radius:999px}
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Slime Magic logo">
  <h1>Thank you for your order!</h1>
  <p>Kaia will pack your slime within 3 business days. Your receipt is on its way to your email, and tracking will follow when it ships.</p>
  <a href="index.html">Back to the shop</a>
</main>
</body>
</html>
